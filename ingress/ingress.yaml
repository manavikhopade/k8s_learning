apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-app-ingress
  namespace: webapp
  annotations:
    # Rewrite the matched path before forwarding to the backend (e.g. /pay -> /).
    nginx.ingress.kubernetes.io/rewrite-target: /
    # Auto-redirect insecure HTTP (80) to HTTPS (443).
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  # Links this Ingress to the controller via a matching IngressClass.
  ingressClassName: nginx
  rules:
    - host: app.kodekloud.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-app
                port:
                  number: 80
          - path: /watch
            pathType: Prefix
            backend:
              service:
                name: watch-service
                port:
                  number: 80
