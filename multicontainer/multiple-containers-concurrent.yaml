apiVersion: v1
kind: Pod
metadata:
  name: multi-container-concurrent
  labels:
    app: demo
spec:
  containers:
    - name: app
      image: nginx:1.27
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi

    - name: worker
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: 100m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 64Mi

# This pod runs two containers at the same time inside the same Pod.
# Both containers are started together and share the Pod network and storage.
# Use this when app + helper process need to run concurrently in one Pod.
