apiVersion: v1
kind: Pod
metadata:
  name: app-with-sidecar
  labels:
    app: demo
spec:
  containers:
    - name: app
      image: nginx:1.27
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi

    - name: sidecar-log-agent
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo 'sidecar log: app is running'; sleep 20; done"]
      resources:
        requests:
          cpu: 50m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 32Mi

# This pod has 2 containers: main app + sidecar helper.
# The sidecar runs alongside the main container and supports it without being the primary workload.
# Common examples: log forwarding, metrics collection, proxy, config sync, or security agents.
# Sidecars are started and stopped with the main Pod lifecycle.
