apiVersion: v1
kind: Pod
metadata:
  name: app-with-init
  labels:
    app: demo
spec:
  initContainers:
    - name: init-db-check
      image: busybox:1.36
      command: ["sh", "-c", "echo 'Initializing database config'; sleep 5"]
      resources:
        requests:
          cpu: 50m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 32Mi

  containers:
    - name: app
      image: nginx:1.27
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi

    - name: logger
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo 'logging...'; sleep 10; done"]
      resources:
        requests:
          cpu: 50m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 32Mi

# This pod has 1 init container and 2 main containers.
# The init container runs first and must finish successfully before the app containers start.
# Good for setup tasks like DB migration, config download, secret preparation, or startup checks.
