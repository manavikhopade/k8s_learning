apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: view-nodes-cluster-wide
subjects:
  - kind: ServiceAccount
    name: app-sa
    namespace: my-namespace # ServiceAccount subjects always need their namespace

  - kind: Group
    name: platform-team
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: node-and-namespace-viewer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dev-team-view
subjects:
  - kind: Group
    name: dev-team
    apiGroup: rbac.authorization.k8s.io
roleRef:
  # "view" is a built-in ClusterRole shipped with Kubernetes
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
