apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader
  # A Role only works inside this one namespace
  namespace: dev
rules:
  # Read-only access to Secrets
  - apiGroups: [""] # "" means the core API group
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]

  # Read-only access to ConfigMaps
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
