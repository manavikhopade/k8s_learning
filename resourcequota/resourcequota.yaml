apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-quota
spec:
  hard:
    # Aggregate compute across all Pods in the namespace
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi

    # Object counts
    pods: "20"
    services: "10"
    services.nodeports: "2"
    services.loadbalancers: "1"
    configmaps: "20"
    secrets: "20"
    persistentvolumeclaims: "10"

    # Aggregate storage across all PVCs
    requests.storage: 100Gi
